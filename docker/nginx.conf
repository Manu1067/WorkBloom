server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Impact image uploads are capped at 5 MB by the backend (+ multipart overhead)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API: browser calls /spring-api/... -> Spring Boot /api/... ---------
    location /spring-api/ {
        proxy_pass https://workbloom-backend.onrender.com/api/;
        proxy_http_version 1.1;

        # Required when Nginx connects to the Render HTTPS backend
        proxy_ssl_server_name on;
        proxy_ssl_name workbloom-backend.onrender.com;

        proxy_set_header Host              workbloom-backend.onrender.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The AI Wellness call can wait up to 120 s for n8n.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # --- Static files served by Spring Boot -------------------------------
    # Destination images + uploaded images
    location /images/ {
        proxy_pass https://workbloom-backend.onrender.com;

        proxy_ssl_server_name on;
        proxy_ssl_name workbloom-backend.onrender.com;

        proxy_set_header Host              workbloom-backend.onrender.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass https://workbloom-backend.onrender.com;

        proxy_ssl_server_name on;
        proxy_ssl_name workbloom-backend.onrender.com;

        proxy_set_header Host              workbloom-backend.onrender.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- React app ----------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    # Direct navigation to /travel, /reset-password?token=..., etc.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}