spring.application.name=workbloom
spring.datasource.url=jdbc:postgresql://localhost:5432/workbloom
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# n8n wellness webhook - externalized. Defaults to a local n8n instance
# for convenience in dev; override with N8N_WELLNESS_WEBHOOK_URL in
# production (see .env.example and docs/N8N_OLLAMA_SETUP.md).
n8n.wellness.webhook-url=${N8N_WELLNESS_WEBHOOK_URL:n8n.wellness.webhook-url=${N8N_WELLNESS_WEBHOOK_URL}

# Outbound HTTP client timeouts (used by RestClientConfig for calls to
# n8n / Ollama and any other external integration).
workbloom.http-client.connect-timeout-ms=5000
workbloom.http-client.read-timeout-ms=120000


# CORS - only matters for a real cross-origin deployment (frontend and
# backend on different domains/ports). Local dev never hits this: the
# Vite proxy makes every request same-origin. Comma-separated list.
workbloom.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
# Disable Spring AI models for now
# Disable Spring AI auto-configuration
spring.ai.model.chat=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none

# JWT signing secret (Phase 1 secrets fix) - required, no default.
# Set the JWT_SECRET environment variable before starting the app.
jwt.secret=${JWT_SECRET}

# Travel seed data (database/seed/*.sql). Applied at startup ONLY into empty
# Travel tables so the questionnaire/destinations load from PostgreSQL.
# Set enabled=false to manage seeding manually; directory is optional.
workbloom.travel.seed.enabled=${TRAVEL_SEED_ENABLED:true}
workbloom.travel.seed.directory=${TRAVEL_SEED_DIR:}

# Image uploads (Impact activity banners). Files are stored on local disk - no
# cloud key needed. The directory is created on first upload; keep it out of
# Git (uploads/ is ignored) and on a persistent volume in production.
workbloom.upload.dir=${UPLOAD_DIR:uploads}
workbloom.upload.max-image-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =========================================================
# EMAIL / PASSWORD RESET
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

workbloom.mail.from=${MAIL_USERNAME}
workbloom.frontend.url=${FRONTEND_BASE_URL:http://localhost:3000}